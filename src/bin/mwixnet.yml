name: mwixnet
about: MWixnet CoinSwap Server
author: scilio

args:
  - config_file:
      help: Path to load/save the mwixnet-config.toml configuration file
      short: c
      long: config_file
      takes_value: true
  - testnet:
      help: Run grin against the Testnet (as opposed to mainnet)
      long: testnet
      takes_value: false
  - server_pass_file:
      help: Path to a file containing the server password
      long: server_pass_file
      takes_value: true
  - grin_node_url:
      help: HTTP(S) URL or address of running GRIN node on which to check inputs and post transactions
      short: n
      long: grin_node_url
      takes_value: true
  - grin_node_foreign_api_secret_path:
      help: Path to a file containing the secret for the Grin node foreign API
      long: grin_node_foreign_api_secret_path
      takes_value: true
  - wallet_owner_url:
      help: Api address of running wallet owner listener
      short: l
      long: wallet_owner_url
      takes_value: true
  - wallet_owner_secret_path:
      help: Path to a file containing the secret for the wallet owner api
      long: wallet_owner_secret_path
      takes_value: true
  - wallet_pass:
      help: The wallet's password
      long: wallet_pass
      takes_value: true
  - no_fee_collection:
      help: Leave hop fees to miners instead of collecting them in a wallet
      long: no_fee_collection
      takes_value: false
  - bind_addr:
      help: Address to bind the rpc server to (e.g. 127.0.0.1:3000)
      long: bind_addr
      takes_value: true
  - prev_server:
      help: Hex Ed25519 identity key of the previous swap/mix server
      long: prev_server
      takes_value: true
  - next_server:
      help: Hex Ed25519 identity key of the next mix server
      long: next_server
      takes_value: true
subcommands:
  - init-config:
      about: Writes a new configuration file
  - pubkey:
      about: Outputs the Ed25519 identity key of the server
      args:
        - output_file:
            help: Path to output the public key to
            long: output_file
            short: o
            takes_value: true
            required: false
  - onion-pubkey:
      about: Outputs the X25519 onion encryption key of the server
      args:
        - output_file:
            help: Path to output the public key to
            long: output_file
            short: o
            takes_value: true
            required: false
