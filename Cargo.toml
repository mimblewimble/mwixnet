[package]
name = "mwixnet"
default-run = "mwixnet"
version = "0.1.0"
edition = "2021"

[dependencies]
async-std = { version = "1", features = ["tokio1"] }
async-trait = "0.1.74"
bytes = "1.5.0"
chrono = "0.4.31"
clap = { version = "2.33", features = ["yaml"] }
dirs = "2.0"
function_name = "0.3.0"
futures = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["native-tokio", "http1", "ring", "tls12"] }
itertools = { version = "0.12.0" }
jsonrpc-core = "18.0.0"
jsonrpc-derive = "18.0.0"
rand = "0.7.3"
remove_dir_all = "0.8.2"
ring = "0.16"
rpassword = "4.0"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
thiserror = "1.0.30"
tokio = { version = "1.37.0", features = ["full"] }
toml = "0.8.8"
log = "0.4.20"

grin_api = { path = "grin-wallet/grin/api" }
grin_core = { path = "grin-wallet/grin/core" }
grin_chain = { path = "grin-wallet/grin/chain" }
grin_keychain = { path = "grin-wallet/grin/keychain" }
grin_p2p = { path = "grin-wallet/grin/p2p" }
grin_servers = { path = "grin-wallet/grin/servers" }
grin_store = { path = "grin-wallet/grin/store" }
grin_util = { path = "grin-wallet/grin/util" }
grin_wallet_api = { path = "grin-wallet/api" }
grin_wallet_config = { path = "grin-wallet/config" }
grin_wallet_controller = { path = "grin-wallet/controller" }
grin_wallet_impls = { path = "grin-wallet/impls" }
grin_wallet_libwallet = { path = "grin-wallet/libwallet" }

[dev-dependencies]
tempfile = "3"
grin_wallet_libwallet = { path = "grin-wallet/libwallet", features = ["mwixnet-test"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
